<!DOCTYPE html>

<head>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        .profile-container {
            background-color: #ffffff;
            margin-top: 6vh;
            width: 100%;
            max-width: 600px;
            margin: auto;
            border-radius: 0px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            position: relative;
            background-image: url('@userpruevabg.jpg'); /* Agrega aquí la URL de la imagen de fondo */
            background-size: 120% 180%;
            height: 150px;
            border-radius: 0px 0px 0 0;
        }
        .profile-picture {
            position: relative;
            bottom: -100px;
            left: 18px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid white;
        }
        .name {
            margin-top: 50px;
            text-align: left;
            font-size: 19px;
            font-weight: bold;
            margin-left: 20px;
            color: #333;
        }
        .bio {
            text-align: left;
            font-size: 15px;
            color: #333;
            padding: 10px 20px;
        }
        .buttons {
            display: flex;
            justify-content: space-evenly;
            margin-top: 10px;
            padding-bottom: 20px;
            border-bottom: 0px solid #1DA1F2;
        }
        .button {
            background-color: #1DA1F2;
            color: white;
            border: none;
            padding: 10px 10px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 15px;
        }
        .button:hover {
            background-color: #0d8ed7;
        }
        .button1 {
            background-color: #1DA1F2;
            color: white;
            border: none;
            padding: 10px 10px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 15px;
        }
        
        .stats {
            display: flex;
            justify-content: space-evenly;
            padding: 10px 0;
            background-color: #f9f9f9;
            border-bottom: 1px solid #eee;
        }
        .stat {
            text-align: center;
        }
        .stat h4 {
            margin: 0;
            font-size: 16px;
            color: #777;
        }
        .stat p {
            margin: 5px 0 0;
            font-size: 18px;
            color: #333;
        }
        
        
  .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1DA1F2;
            border-top: 0px solid gray;
            display: flex;
            justify-content: space-around;
            padding: 5px 0;
        }
        .footer button {
            background-color: transparent; /* Color del botón */
            color: #fff; /* Color del texto */
            border: 0px solid #fff;
            border-radius: 20px;
            padding: 5px 5px;
            cursor: pointer;
            font-size: 14px;
            width: 30vw;
        }
        .footer button:hover {
            background-color: #0095f6; /* Color al pasar el cursor */
        }
        
        
        .footer button:hover {
            background-color: #0095f6; /* Color al pasar el cursor */
        }     
        
 .chat-button {

            align-items: center;
            justify-content: center;

            font-size: 24px;
